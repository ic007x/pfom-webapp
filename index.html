                  className="absolute top-4 right-4 bg-[#000000] text-[#fafafa] p-1 border border-[#000000]"
                >
                  <X className="w-5 h-5" />
                </button>

                <div className="bg-[#000000] text-[#ffea01] p-3 font-black text-base uppercase border border-[#000000]">
                  MILL DIRECT B2B QUOTATION REQUEST
                </div>

                {rfqSubmitted ? (
                  <div className="bg-[#ffea01] p-6 border-4 border-[#000000] space-y-3 text-center">
                    <CheckCircle2 className="w-12 h-12 mx-auto text-[#000000]" />
                    <h4 className="font-black text-lg uppercase">RFQ Submitted Successfully!</h4>
                    <p className="text-xs font-bold">
                      Our commercial sales desk will process your volume request and send an official Proforma Quote within 2 business hours.
                    </p>
                  </div>
                ) : (
                  <form onSubmit={handleRfqSubmit} className="space-y-4 text-xs font-bold">
                    <div>
                      <label className="block mb-1">Full Name *</label>
                      <input 
                        required 
                        type="text" 
                        value={rfqForm.name}
                        onChange={(e) => setRfqForm({ ...rfqForm, name: e.target.value })}
                        className="w-full bg-[#fafafa] border-2 border-[#000000] p-2.5 focus:outline-none" 
                      />
                    </div>

                    <div>
                      <label className="block mb-1">Company / Entity Name *</label>
                      <input 
                        required 
                        type="text" 
                        value={rfqForm.company}
                        onChange={(e) => setRfqForm({ ...rfqForm, company: e.target.value })}
                        className="w-full bg-[#fafafa] border-2 border-[#000000] p-2.5 focus:outline-none" 
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block mb-1">Phone / WhatsApp *</label>
                        <input 
                          required 
                          type="tel" 
                          value={rfqForm.phone}
                          onChange={(e) => setRfqForm({ ...rfqForm, phone: e.target.value })}
                          className="w-full bg-[#fafafa] border-2 border-[#000000] p-2.5 focus:outline-none" 
                        />
                      </div>
                      <div>
                        <label className="block mb-1">Email Address *</label>
                        <input 
                          required 
                          type="email" 
                          value={rfqForm.email}
                          onChange={(e) => setRfqForm({ ...rfqForm, email: e.target.value })}
                          className="w-full bg-[#fafafa] border-2 border-[#000000] p-2.5 focus:outline-none" 
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block mb-1">Product Selection *</label>
                      <select 
                        value={rfqForm.product}
                        onChange={(e) => setRfqForm({ ...rfqForm, product: e.target.value })}
                        className="w-full bg-[#fafafa] border-2 border-[#000000] p-2.5 focus:outline-none font-bold"
                      >
                        {PRODUCTS.map(p => (
                          <option key={p.id} value={p.name}>{p.name}</option>
                        ))}
                      </select>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block mb-1">Required Qty (MT) *</label>
                        <input 
                          required 
                          type="number" 
                          value={rfqForm.quantity}
                          onChange={(e) => setRfqForm({ ...rfqForm, quantity: e.target.value })}
                          className="w-full bg-[#fafafa] border-2 border-[#000000] p-2.5 focus:outline-none" 
                        />
                      </div>
                      <div>
                        <label className="block mb-1">Destination City / Port</label>
                        <input 
                          type="text" 
                          value={rfqForm.destination}
                          onChange={(e) => setRfqForm({ ...rfqForm, destination: e.target.value })}
                          className="w-full bg-[#fafafa] border-2 border-[#000000] p-2.5 focus:outline-none" 
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block mb-1">Custom Specs / Packaging Notes</label>
                      <textarea 
                        rows="3" 
                        value={rfqForm.notes}
                        onChange={(e) => setRfqForm({ ...rfqForm, notes: e.target.value })}
                        placeholder="e.g. Tanker load, 200L HDPE Drums, Flexi-tank export, specific FFA requirements..."
                        className="w-full bg-[#fafafa] border-2 border-[#000000] p-2.5 focus:outline-none" 
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full bg-[#ffea01] text-[#000000] font-black py-3.5 border-2 border-[#000000] shadow-[5px_5px_0px_#d946ef] active:translate-x-[2px] active:translate-y-[2px] active:shadow-[2px_2px_0px_#d946ef] uppercase text-sm tracking-wider"
                    >
                      Transmit Commercial RFQ
                    </button>
                  </form>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
